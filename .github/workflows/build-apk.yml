name: Build SmartCleaner Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project (extract zip if needed)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          if ls settings.gradle settings.gradle.kts >/dev/null 2>&1; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            WORK="$RUNNER_TEMP/project"
            mkdir -p "$WORK"
            shopt -s nullglob
            ZIPS=( *.zip )
            shopt -u nullglob
            if [ ${#ZIPS[@]} -eq 0 ]; then
              echo "::error::No settings.gradle(.kts) and no .zip found at repo root."
              exit 1
            fi
            for z in "${ZIPS[@]}"; do
              echo "Extracting: $z"
              unzip -q -o "$z" -d "$WORK"
            done
            SETTINGS="$(find "$WORK" -name 'settings.gradle*' -type f | head -n 1 || true)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::The zip has no settings.gradle(.kts). It only contains source files. Upload the full Android project (settings.gradle, build.gradle, gradlew, app/...)."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify referenced types exist
        shell: bash
        run: |
          set -euo pipefail
          for pattern in 'class CleanCategory\b' 'class StorageStats\b' 'class ScannedItem\b' 'object CleanerEngine\b'; do
            if ! grep -RqE --include='*.kt' "$pattern" "$PROJECT_DIR"; then
              echo "::error::Missing declaration matching '$pattern' (required by AiOfflineBrain.kt)."
              exit 1
            fi
          done
          echo "All referenced types found."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCleanerPro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
