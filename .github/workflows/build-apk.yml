name: Build SmartCleanerPro v6 Audited APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP Automatically
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -printf "%T@ %p\n" | sort -n | tail -1 | cut -f2- -d" ")
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Error: No ZIP file found in the repository root!"
            exit 1
          fi
          echo "✅ Extracting project archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCleanerPro-v6-Audited-APK
          path: app/build/outputs/apk/debug/*.apk
          
